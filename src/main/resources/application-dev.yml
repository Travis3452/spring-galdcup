spring:
  application:
    name: galdcup

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/galdcup?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root1234!!
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10

  # 2. JPA: MySQL Dialect 유지 및 성능 옵션 적용
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update # 로컬 개발 편의성을 위해 update 유지
    show-sql: false
    open-in-view: false # 운영과 동일하게 false 설정 (성능 최적화 연습)
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  data:
    web:
      pageable:
        default-page-size: 30 # 1페이지 캐싱 로직과 동기화
        one-indexed-parameters: true

    # 4. Redis: 로컬 환경 설정
    redis:
      host: localhost
      port: 6379
      username: default

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  servlet:
    encoding:
      force: true
      charset: UTF-8

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cookie:
  secure: false
  sameSite: Lax

aes256:
  key: ${AES256_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000
  refresh-expiration-days: 7

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

gemini:
  api:
    key: ${GEMINI_AI_KEY}

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.example.galdcup: DEBUG