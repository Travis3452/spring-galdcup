spring:
  application:
    name: galdcup

  data:
    web:
      pageable:
        default-page-size: 30
        max-page-size: 50

  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: ${REDISHOST}
    port: ${REDISPORT}
    username: ${REDISUSER}
    password: ${REDISPASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://galdcup-api.onrender.com/api/auth/callback/google
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

aes256:
  key: ${AES256_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000
  refresh-expiration-days: 7

server:
  port: 8080